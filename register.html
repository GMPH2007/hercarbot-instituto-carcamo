<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Registro Docente y Administrativo — HercarBot IA | IESTP "Hermanos Cárcamo" - Paita</title>
  
  <link rel="shortcut icon" href="https://ieshercar.edu.pe/public/assets/img/Logo&Fondo/Logo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Jost:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #0f3380;
      --accent: #2563eb;
      --gold: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.25), transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.15), transparent 40%),
                  linear-gradient(135deg, #070e1e 0%, #0c1b36 50%, #071124 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #f1f5f9;
    }
    .register-card {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .auth-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .auth-title {
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      color: #ffffff;
      text-align: center;
    }
    .auth-subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
      margin-bottom: 20px;
    }
    .form-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #ffffff;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.86rem;
      transition: all 0.2s ease;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .form-select option {
      background: #0f172a;
      color: #ffffff;
    }
    .btn-auth-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-auth-primary:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
    }
    .auth-alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      display: none;
      margin-bottom: 16px;
    }
    .auth-alert.danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .auth-links {
      text-align: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
    }
    .auth-links a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="auth-logo-box">
      <img src="assets/img/logo-hercar.png" onerror="this.src='https://ieshercar.edu.pe/public/assets/img/Logo-Hercar.png'" alt="Logo IESTP Hermanos Cárcamo" class="auth-logo">
      <div class="text-start">
        <h5 class="mb-0 fw-bold text-white" style="font-size: 1.15rem;">HercarBot IA</h5>
        <small class="text-warning fw-semibold" style="font-size: 0.72rem;"><i class="bi bi-person-badge-fill me-1"></i>Portal de Registro Docente</small>
      </div>
    </div>

    <h2 class="auth-title">Crear Cuenta Docente</h2>
    <p class="auth-subtitle">Regístrate como docente o personal administrativo del IESTP Hermanos Cárcamo para gestionar el panel.</p>

    <div id="registerAlert" class="auth-alert"></div>

    <form id="registerForm" autocomplete="off">
      <div class="row g-2 mb-2">
        <div class="col-sm-7">
          <label for="regName" class="form-label">Nombres y Apellidos Completos:</label>
          <input type="text" id="regName" class="form-control" placeholder="Ej: Lic. Carlos Mendoza Flores" required>
        </div>
        <div class="col-sm-5">
          <label for="regDni" class="form-label">Número de DNI:</label>
          <input type="text" id="regDni" class="form-control" placeholder="8 dígitos" maxlength="8" pattern="[0-9]{8}" required>
        </div>
      </div>

      <div class="mb-2">
        <label for="regEmail" class="form-label">Correo Institucional / Contacto:</label>
        <input type="email" id="regEmail" class="form-control" placeholder="profesor@ieshercar.edu.pe" required>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-sm-6">
          <label for="regCareer" class="form-label">Programa / Área:</label>
          <select id="regCareer" class="form-select" required>
            <option value="APSTI - Desarrollo de Software">💻 APSTI (Sistemas y TI)</option>
            <option value="Administración de Negocios Internacionales">🚢 Negocios Internacionales</option>
            <option value="Contabilidad">📊 Contabilidad</option>
            <option value="Desarrollo Pesquero y Acuícola">🐟 Pesquería y Acuicultura</option>
            <option value="Dirección y Secretaría General">🏛️ Dirección / Secretaría</option>
          </select>
        </div>
        <div class="col-sm-6">
          <label for="regToken" class="form-label">Código de Verificación:</label>
          <input type="text" id="regToken" class="form-control" value="HERCAR2026" required title="Código de autorización del instituto">
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-sm-6">
          <label for="regPassword" class="form-label">Contraseña:</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <div class="col-sm-6">
          <label for="regPasswordConfirm" class="form-label">Confirmar Contraseña:</label>
          <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Repite contraseña" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn-auth-primary" id="btnRegisterSubmit">
        <i class="bi bi-check-circle-fill me-1"></i> Registrar y Activar Cuenta
      </button>
    </form>

    <div class="auth-links">
      <div class="mb-2">
        <span class="text-muted">¿Ya tienes cuenta de docente?</span>
        <a href="login.html">Iniciar Sesión aquí</a>
      </div>
      <div>
        <a href="index.html" class="text-white-50"><i class="bi bi-arrow-left me-1"></i>Volver al Asistente HercarBot</a>
      </div>
    </div>
  </div>

  <script>
    function showAlert(msg, type = 'danger') {
      const alertBox = document.getElementById('registerAlert');
      alertBox.textContent = msg;
      alertBox.className = `auth-alert ${type}`;
      alertBox.style.display = 'block';
    }

    const regForm = document.getElementById('registerForm');
    regForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const dni = document.getElementById('regDni').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const career = document.getElementById('regCareer').value;
      const token = document.getElementById('regToken').value.trim().toUpperCase();
      const pass = document.getElementById('regPassword').value;
      const passConfirm = document.getElementById('regPasswordConfirm').value;

      if (pass !== passConfirm) {
        showAlert('Las contraseñas no coinciden. Por favor verifícalas.', 'danger');
        return;
      }

      if (token !== 'HERCAR2026' && token !== 'CARCAMO2026') {
        showAlert('Código de autorización incorrecto. Solicítalo a Secretaría General o usa: HERCAR2026', 'danger');
        return;
      }

      let users = [];
      try {
        users = JSON.parse(localStorage.getItem('hercar_admin_users')) || [];
      } catch (err) {
        users = [];
      }

      if (users.some(u => u.email === email)) {
        showAlert('Este correo ya está registrado en el sistema. Puedes iniciar sesión directamente.', 'danger');
        return;
      }

      const newUser = {
        name,
        dni,
        email,
        career,
        pass,
        role: `Docente (${career})`,
        createdAt: new Date().toISOString()
      };

      users.push(newUser);
      localStorage.setItem('hercar_admin_users', JSON.stringify(users));

      showAlert('¡Cuenta creada exitosamente! Redirigiendo al formulario de inicio de sesión...', 'success');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    });
  </script>
</body>
</html>
